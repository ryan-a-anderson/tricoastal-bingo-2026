# fly.toml app configuration file generated for tricoastal-bingo on 2026-06-01T11:57:52-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tricoastal-bingo'
primary_region = 'sjc'

[build]

[env]
  DATABASE_PATH = '/data/bingo.db'
  PORT = '8080'

[[mounts]]
  source = 'bingo_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
